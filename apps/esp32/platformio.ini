[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps = bblanchon/ArduinoJson@6.21.5
monitor_speed = 115200

# Link network code too; placeholder credentials still disable controls.
[env:esp32-network-check]
extends = env:esp32dev
build_flags = -DKS_DRY_RUN=0 -DKS_LED_SENDING=23 -DKS_LED_COMPLETED=25 -DKS_LED_ERROR=26 -DKS_ROTARY_A=32 -DKS_ROTARY_B=33 -DKS_ROTARY_PRESS=27

[env:esp32-dimmer-check]
extends = env:esp32-network-check
build_flags = ${env:esp32-network-check.build_flags} -DKS_ROTARY_DIMMER=1
