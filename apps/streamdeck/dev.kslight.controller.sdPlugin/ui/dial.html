<!doctype html><html lang="en"><meta charset="utf-8"><title>KS Light</title>
<link rel="stylesheet" href="pi.css">
<h2>Choose light action</h2><p>Turn to browse actions; press to run the selection. Turning alone sends nothing. Use full paths on this PC.</p>
<label class="inline"><input type="checkbox" id="shared"> Use shared connection for this key</label>
<p id="scope"></p>
<label for="python">Python executable</label><input id="python" placeholder="C:\KS-Light\.venv\Scripts\python.exe">
<label for="repository">KS Light repository folder</label><input id="repository" placeholder="C:\KS-Light">
<label for="config">Controller configuration file</label><input id="config" placeholder="C:\KS-Light\.hub-local\controller.json">
<label for="action">Action names, separated by commas</label><input id="action" placeholder="purple-breathing">
<div class="actions"><button id="saveConnection">Save shared connection</button>
<button id="save">Save key</button></div><p id="status" role="status"></p>
<p>Credentials stay in your token file. Sent means the hub completed delivery; it does not confirm the lamp's physical state. Simulated means no lamp was changed.</p>
<script src="settings.js"></script></html>
