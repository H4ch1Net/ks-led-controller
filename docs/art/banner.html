<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KS Light banner</title>
<!-- Source for docs/images/banner.png and social-preview.png. Render with: node docs/art/render.mjs -->
<style>
  :root { --ink: #111514; --panel: #191e1c; --well: #0d1110; --text: #ecf0ec; --muted: #95a09b; --faint: #808b86; --accent: #d4efa3; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background-color: var(--ink);
    background-image: radial-gradient(rgb(255 255 255 / .05) 1.2px, transparent 1.4px);
    background-size: 22px 22px;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Arial, sans-serif; color: var(--text);
    display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; padding: 0 88px; gap: 40px; overflow: hidden;
  }
  .copy { display: grid; gap: 22px; }
  .mark { display: flex; align-items: center; gap: 18px; }
  .mark img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 0 0 1px rgb(255 255 255 / .06); }
  h1 { font-size: 76px; font-weight: 650; letter-spacing: -0.045em; line-height: 1; }
  p { font-size: 25px; line-height: 1.35; color: var(--muted); max-width: 640px; letter-spacing: -0.01em; }
  .labels { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .labels span { display: inline-flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .labels span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px -1px var(--accent); }
  .labels span.off::before { background: var(--faint); box-shadow: none; }
  .stage { position: relative; display: flex; justify-content: center; }
  .lenses { display: flex; gap: 44px; padding-bottom: 30px; }
  .lens { position: relative; flex: none; width: 118px; height: 118px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #2b3330, #151a18 70%); box-shadow: inset 0 0 0 1.5px rgb(255 255 255 / .12), inset 0 -10px 18px rgb(0 0 0 / .4); }
  .lens::before { content: ""; position: absolute; inset: -56px; border-radius: 50%; background: radial-gradient(closest-side, var(--c), transparent); opacity: .2; }
  .lens i { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--c) 30%, white) 0%, var(--c) 45%, color-mix(in srgb, var(--c) 72%, black) 100%); box-shadow: 0 0 34px 0 color-mix(in srgb, var(--c) 55%, transparent); }
  .lens.dim i { opacity: .82; }
  .lens.off::before, .lens.off i { display: none; }
  .lens::after { content: ""; position: absolute; inset: 16px; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / .06); }
  .caption { position: absolute; left: 50%; top: calc(100% + 18px); transform: translateX(-50%); white-space: nowrap; font: 600 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; color: var(--faint); }
  body.social { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 70px 80px 74px; }
  body.social .stage { justify-content: flex-start; }
  body.social h1 { font-size: 84px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark"><img src="../images/app-icon.svg" alt=""><h1>KS Light</h1></div>
    <p>Local control for KS Bluetooth lights. Android app, shared hub, no cloud.</p>
    <div class="labels"><span>Android</span><span>Hub + dashboard</span><span>Home Assistant</span><span>Stream Deck</span></div>
  </div>
  <div class="stage" aria-hidden="true">
    <div class="lenses">
      <span class="lens dim" style="--c:#ffaa5a"><i></i><span class="caption">#FFAA5A · 40%</span></span>
      <span class="lens" style="--c:#b25cff"><i></i><span class="caption">BREATHING</span></span>
      <span class="lens" style="--c:#2850ff"><i></i><span class="caption">#2850FF</span></span>
      <span class="lens off"><i></i><span class="caption">OFF</span></span>
    </div>
  </div>
  <script>if (location.hash === "#social") document.body.classList.add("social");</script>
</body>
</html>
